name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: oxfmt (check)
        run: npx --yes oxfmt --check .

      - name: oxlint
        run: npx --yes oxlint .
